<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>알바 기록장 구성</title>
<style>
  body { margin: 0; background: #12141a; color: #e8eaf0; font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  .wrap { max-width: 1800px; margin: 0 auto; padding: 16px; }
  svg { width: 100%; height: auto; display: block; }
  .note { color: #8b93a5; font-size: 14px; text-align: center; margin: 4px 0 24px; }
</style>
</head>
<body>
<div class="wrap">
  <svg id="map" role="img" aria-label="알바 기록장 구성 요소 마인드맵"></svg>
  <p class="note">2026-11-26 기준 · 줄 수는 git에 올라간 파일 기준 · 외부 라이브러리·패키지 의존성 0개</p>
</div>
<script>
// 데이터만 바꾸면 마인드맵이 다시 그려진다. side: -1 왼쪽, 1 오른쪽. 가지 위치는 항목 수에 맞춰 자동 배치
const CENTER_TITLE = ['알바 기록장', '구성 요소'];
const CENTER_SUB = ['근무 기록 + 임금 자동 계산', '웹 화면 · Node 서버 · Tailscale'];
const BRANCHES = [
  { side: -1, color: '#38bdf8', title: '화면 (프론트엔드)', sub: 'index.html · 764줄', items: [
    ['언어: HTML + CSS + JavaScript', '프레임워크 없이 순수 JS (CSS 155줄 · JS 549줄)'],
    ['달력', '월 이동 · 근무시간별 날짜 칸 색 · 근무 칩'],
    ['근무 기록', '12시간제 · 5분 단위 입력 · 출퇴근 버튼'],
    ['근무지 관리', '시급 · 색 · 정산 마감일 · 주휴/가산 설정'],
    ['임금 계산', '기본급 · 주휴수당 · 야간/휴일 가산 · 휴게 차감'],
    ['테마', '다크 기본 · 라이트 전환 (기기별 저장)'],
  ] },
  { side: -1, color: '#fb923c', title: '서버 (백엔드)', sub: 'server.js · 81줄', items: [
    ['언어: JavaScript (Node.js)', 'Node 기본 모듈만 사용 (http · fs · path)'],
    ['화면 제공', 'GET / → index.html 전달'],
    ['데이터 API', 'GET·PUT /api/data → JSON 읽기/쓰기'],
    ['동시 수정 방지', 'rev 번호가 다르면 저장 거절 (409)'],
    ['보안', '127.0.0.1에서만 열림 · 모르는 Host 차단'],
    ['안전한 저장', '임시 파일에 쓴 뒤 교체 · 날짜별 스냅샷'],
  ] },
  { side: -1, color: '#2dd4bf', title: '데이터', sub: 'JSON 파일 · git 제외', items: [
    ['data/alba-data.json', '원본 · { rev, data } 형식'],
    ['backup/alba-날짜.json', '저장할 때마다 그날 상태 복사'],
    ['저장 내용', '근무지 · 근무 기록 · 출근 중 상태'],
  ] },
  { side: -1, color: '#4ade80', title: '테스트 · 점검', sub: '자동 검증', items: [
    ['server.test.js (42줄)', 'node --test · 저장·충돌·형식 오류·호스트 차단'],
    ['?test 자체 점검', '주소 뒤 ?test → 임금·정산기간·시간 표시 검사'],
  ] },
  { side: 1, color: '#facc15', title: '사용 언어', sub: '파일별 정리', items: [
    ['화면: HTML · CSS · JavaScript', 'index.html 한 파일'],
    ['서버: JavaScript (Node.js)', 'server.js · CommonJS 방식'],
    ['테스트: JavaScript', 'Node 기본 테스트 도구 node:test'],
    ['데이터: JSON', '사람이 읽을 수 있는 텍스트 파일'],
    ['문서: Markdown · Mermaid · HTML', 'HISTORY.md · docs/ 마인드맵'],
  ] },
  { side: 1, color: '#f472b6', title: 'Node.js 역할', sub: 'v26.13.1 · fnm 설치', items: [
    ['① 서버 프로그램 실행기', '브라우저 밖에서 JavaScript(server.js)를 실행'],
    ['② 웹 서버', '8787 포트로 화면과 데이터 API를 제공'],
    ['③ 파일 저장소 관리', '근무 기록을 PC의 JSON 파일에 읽고 씀'],
  ] },
  { side: 1, color: '#a78bfa', title: 'Tailscale 역할', sub: '개인 VPN · 원격 접속', items: [
    ['① 내 기기끼리만 잇는 사설망', '같은 계정 기기(PC·폰)만 서로 접속 가능'],
    ['② HTTPS 주소 제공', 'tailscale serve → ….ts.net 주소로 서버 중계'],
    ['③ 포트·방화벽 개방 불필요', '공유기 설정 없이 밖에서 집 PC에 접속'],
  ] },
  { side: 1, color: '#60a5fa', title: '운영 · 관리', sub: '실행 환경과 기록', items: [
    ['작업 스케줄러 AlbaTracker', 'Windows 로그온 시 서버 자동 시작'],
    ['fnm (D:\\Node.js)', 'Node.js 버전 관리 도구'],
    ['Git · GitHub', 'baegofa/AlbaTrakerRepo · main 브랜치'],
    ['.gitignore', 'data/ · backup/ 개인 기록은 업로드 제외'],
    ['문서', 'HISTORY.md · docs/connection-delay.html'],
  ] },
];

const svg = document.getElementById('map');
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const W = 2000, BOX = { w: 320, h: 96 }, CBOX = { w: 360, h: 280 }, SPACING = 64, GAP = 44, TOP = 40;

// 각 쪽의 가지를 위에서부터 쌓고, 전체 높이로 가운데 위치를 정한다
const heightOf = (b) => Math.max(b.items.length * SPACING, BOX.h);
const sideHeight = (s) => BRANCHES.filter((b) => b.side === s).reduce((a, b) => a + heightOf(b) + GAP, -GAP);
const H = Math.max(sideHeight(-1), sideHeight(1)) + TOP * 2;
for (const s of [-1, 1]) {
  let y = TOP + (H - TOP * 2 - sideHeight(s)) / 2;
  for (const b of BRANCHES.filter((x) => x.side === s)) { b.y = y + heightOf(b) / 2; y += heightOf(b) + GAP; }
}
const CENTER = { x: W / 2, y: H / 2 };
svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

let h = `<defs><filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
  <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;

for (const b of BRANCHES) {
  const bx = CENTER.x + b.side * 410;
  const inner = bx - b.side * BOX.w / 2;
  const outer = bx + b.side * BOX.w / 2;
  const x0 = CENTER.x + b.side * CBOX.w / 2;
  const y0 = Math.max(CENTER.y - 110, Math.min(CENTER.y + 110, b.y));
  const mx = (x0 + inner) / 2;
  h += `<path d="M${x0} ${y0} C${mx} ${y0}, ${mx} ${b.y}, ${inner} ${b.y}" fill="none" stroke="${b.color}" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>`;
  h += `<rect x="${bx - BOX.w / 2}" y="${b.y - BOX.h / 2}" width="${BOX.w}" height="${BOX.h}" rx="18" fill="#181b24" stroke="${b.color}" stroke-width="4" filter="url(#glow)"/>`;
  h += `<text x="${bx}" y="${b.y - 4}" text-anchor="middle" font-size="30" font-weight="700" fill="#f3f4f8">${esc(b.title)}</text>`;
  h += `<text x="${bx}" y="${b.y + 30}" text-anchor="middle" font-size="19" fill="#b8bfcf">(${esc(b.sub)})</text>`;

  const ax = outer + b.side * 36;
  b.items.forEach(([t, s], i) => {
    const iy = b.y + (i - (b.items.length - 1) / 2) * SPACING;
    const uy = iy + (s ? 30 : 12);
    const anchor = b.side < 0 ? 'end' : 'start';
    const tx = ax + b.side * 8;
    const cx = (outer + ax) / 2;
    h += `<path d="M${outer} ${b.y} C${cx} ${b.y}, ${cx} ${uy}, ${ax} ${uy}" fill="none" stroke="${b.color}" stroke-width="3" stroke-linecap="round" opacity=".9"/>`;
    h += `<g class="item" data-side="${b.side}" data-ax="${ax}">
      <text x="${tx}" y="${iy}" text-anchor="${anchor}" font-size="22" font-weight="600" fill="#f3f4f8">${esc(t)}</text>
      ${s ? `<text x="${tx}" y="${iy + 21}" text-anchor="${anchor}" font-size="15" fill="#aab2c3">${esc(s)}</text>` : ''}
      <line x1="${ax}" y1="${uy}" x2="${ax}" y2="${uy}" stroke="${b.color}" stroke-width="3" stroke-linecap="round" opacity=".9"/>
    </g>`;
  });
}

const cx = CENTER.x - CBOX.w / 2, cy = CENTER.y - CBOX.h / 2;
h += `<rect x="${cx}" y="${cy}" width="${CBOX.w}" height="${CBOX.h}" rx="26" fill="#151a26" stroke="#60a5fa" stroke-width="5" filter="url(#glow)"/>
  <rect x="${cx + 12}" y="${cy + 12}" width="${CBOX.w - 24}" height="${CBOX.h - 24}" rx="18" fill="none" stroke="#2dd4bf" stroke-width="2" opacity=".7"/>
  <text x="${CENTER.x}" y="${CENTER.y - 52}" text-anchor="middle" font-size="42" font-weight="800" fill="#7dd3fc">${esc(CENTER_TITLE[0])}</text>
  <text x="${CENTER.x}" y="${CENTER.y - 2}" text-anchor="middle" font-size="42" font-weight="800" fill="#7dd3fc">${esc(CENTER_TITLE[1])}</text>
  <text x="${CENTER.x}" y="${CENTER.y + 50}" text-anchor="middle" font-size="20" fill="#5eead4">${esc(CENTER_SUB[0])}</text>
  <text x="${CENTER.x}" y="${CENTER.y + 82}" text-anchor="middle" font-size="18" fill="#facc15">${esc(CENTER_SUB[1])}</text>`;

svg.innerHTML = h;

svg.querySelectorAll('g.item').forEach((g) => {
  const side = Number(g.dataset.side), ax = Number(g.dataset.ax);
  const w = Math.max(...[...g.querySelectorAll('text')].map((t) => t.getComputedTextLength())) + 16;
  g.querySelector('line').setAttribute('x2', ax + side * w);
});
</script>
</body>
</html>
